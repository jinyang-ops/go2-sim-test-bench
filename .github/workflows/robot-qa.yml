name: Test bench CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python -m compileall -q robot_test tests
      - run: bash -n scripts/probe_fixed_lr.sh
      - run: python -m unittest discover -s tests -v
# This workflow checks metrics/reporting code. It does NOT run Isaac Gym.
